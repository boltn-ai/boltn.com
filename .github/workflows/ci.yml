name: CI

# The authority: hooks can be skipped, this cannot (main is protected and requires it).
# It runs the same `pnpm check` as the pre-push hook, plus the checks that need the PR itself.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false # nothing after checkout needs to push

      # Node, pnpm and gitleaks at the exact versions in .mise.toml, checksum-verified by mise.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: node pnpm gitleaks

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (lint, design rules, private terms, types, tests, secrets, knip, build, budgets)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: pnpm check

      - name: Private terms in commit messages, PR title and body
        if: github.event_name == 'pull_request'
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git log --format=%B "$BASE..HEAD" > "$RUNNER_TEMP/messages.txt"
          printf '%s\n\n%s\n' "$TITLE" "$BODY" >> "$RUNNER_TEMP/messages.txt"
          node harness/check-private-terms.mjs --message "$RUNNER_TEMP/messages.txt"

      - name: Dependency changes kept separate, and nothing newly published
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: node harness/check-dependencies.mjs --range "$BASE..HEAD" --title "$TITLE"
